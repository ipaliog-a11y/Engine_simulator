name: Tests

# Runs only the tests relevant to the change (owner decision: minimal tests):
#   - every tests/*.mjs the pull request (or push) adds or modifies, and
#   - any extra tests named on a line "Tests: 41 aero" in the pull request description.
# Nothing relevant means nothing runs, and the check passes. The full suite still runs locally with
# `node tests/run.mjs`. The job keeps the name "Tests" so the required check is unchanged.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pick the relevant tests
        id: pick
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          changed=$(git diff --name-only --diff-filter=AMR "$BASE" HEAD -- 'tests/*.mjs' 2>/dev/null \
            | xargs -r -n1 basename | grep -E '^[A-Za-z0-9_.-]+$' | grep -vxE 'run\.mjs|pw\.mjs' || true)
          named=$(printf '%s\n' "$BODY" | grep -iE '^\s*tests:' | head -1 | cut -d: -f2- | tr -c 'A-Za-z0-9_.\n' ' ' || true)
          list=$(echo $changed $named | tr ' ' '\n' | sed '/^$/d' | sort -u | tr '\n' ' ')
          echo "tests: ${list:-none}"
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.pick.outputs.list != ''
        with:
          node-version: 20
          cache: npm
      - name: Install Playwright
        if: steps.pick.outputs.list != ''
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run them
        if: steps.pick.outputs.list != ''
        env:
          LIST: ${{ steps.pick.outputs.list }}
        run: node tests/run.mjs $LIST
